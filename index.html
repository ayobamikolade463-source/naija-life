<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d24">
<title>NAIJA LIFE</title>
<style>
  :root{
    --green:#0b3d24; --green2:#14663d; --leaf:#2fa866; --cream:#f3ecd8;
    --ink:#10261a; --gold:#f2b632; --red:#d9482b; --card:#fffdf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:var(--green); color:var(--ink);
    display:flex; justify-content:center; align-items:flex-start;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    min-height:100%;
  }
  .wrap{width:100%; max-width:440px; padding:28px 20px 40px}
  h1.logo{
    font-family:Impact,"Arial Black",sans-serif; font-size:44px; letter-spacing:2px;
    color:var(--cream); line-height:1; text-align:center;
  }
  h1.logo span{color:var(--gold)}
  .tag{color:#bcd9c6; text-align:center; font-size:14px; margin:8px 0 24px}
  .stripe{height:6px; border-radius:3px; margin-bottom:22px;
    background:linear-gradient(90deg,var(--leaf) 33%,var(--cream) 33% 66%,var(--leaf) 66%)}
  .card{background:var(--card); border-radius:18px; padding:22px 18px}
  h2{font-size:22px; margin-bottom:14px}
  label{display:block; font-size:14px; font-weight:bold; margin:12px 0 6px}
  input{
    width:100%; padding:14px; font-size:16px; border:2px solid #cfd8c9;
    border-radius:12px; background:#fff; color:var(--ink);
  }
  input:focus{outline:3px solid var(--gold); border-color:var(--green2)}
  button{
    width:100%; margin-top:18px; padding:15px; font-size:17px; font-weight:bold;
    border:none; border-radius:12px; background:var(--green2); color:#fff; cursor:pointer;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.6}
  button.alt{background:transparent; color:var(--green2); border:2px solid var(--green2)}
  .links{display:flex; justify-content:space-between; margin-top:16px; gap:10px}
  .linkbtn{
    background:none; border:none; color:var(--green2); width:auto; margin:0;
    padding:6px 2px; font-size:14px; text-decoration:underline; font-weight:bold;
  }
  .msg{margin-top:14px; padding:12px; border-radius:10px; font-size:14px; display:none}
  .msg.err{display:block; background:#fde4de; color:#8a2310}
  .msg.ok{display:block; background:#dff3e6; color:#0b4a28}
  .hidden{display:none !important}
  .stat{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #e3e0d0; font-size:15px}
  .stat b{font-size:16px}
  .note{font-size:12px; color:#5b6b5f; margin-top:10px}
  .loading{color:var(--cream); text-align:center; margin-top:60px}
  @media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="logo">NAIJA <span>LIFE</span></h1>
  <p class="tag">Your World. Your Lifestyle. Your Rules.</p>
  <div class="stripe"></div>

  <div id="loading" class="loading">Loading...</div>

  <!-- LOGIN -->
  <section id="login" class="card hidden">
    <h2>Log in</h2>
    <label for="l_email">Email</label>
    <input id="l_email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="l_pass">Password</label>
    <input id="l_pass" type="password" autocomplete="current-password" placeholder="Your password">
    <button id="btnLogin">Log in</button>
    <div class="links">
      <button class="linkbtn" data-go="register">Create account</button>
      <button class="linkbtn" data-go="forgot">Forgot password?</button>
    </div>
    <div id="m_login" class="msg"></div>
  </section>

  <!-- REGISTER -->
  <section id="register" class="card hidden">
    <h2>Create account</h2>
    <label for="r_email">Email</label>
    <input id="r_email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="r_pass">Password (min 8 characters)</label>
    <input id="r_pass" type="password" autocomplete="new-password" placeholder="Choose a password">
    <label for="r_pass2">Confirm password</label>
    <input id="r_pass2" type="password" autocomplete="new-password" placeholder="Type it again">
    <button id="btnRegister">Create account</button>
    <div class="links">
      <button class="linkbtn" data-go="login">I already have an account</button>
    </div>
    <div id="m_register" class="msg"></div>
  </section>

  <!-- FORGOT -->
  <section id="forgot" class="card hidden">
    <h2>Reset password</h2>
    <label for="f_email">Email</label>
    <input id="f_email" type="email" autocomplete="email" placeholder="you@example.com">
    <button id="btnForgot">Send reset link</button>
    <div class="links">
      <button class="linkbtn" data-go="login">Back to log in</button>
    </div>
    <div id="m_forgot" class="msg"></div>
  </section>

  <!-- NEW PASSWORD (after clicking reset link) -->
  <section id="newpass" class="card hidden">
    <h2>Set a new password</h2>
    <label for="n_pass">New password (min 8 characters)</label>
    <input id="n_pass" type="password" autocomplete="new-password">
    <label for="n_pass2">Confirm new password</label>
    <input id="n_pass2" type="password" autocomplete="new-password">
    <button id="btnNewPass">Save new password</button>
    <div id="m_newpass" class="msg"></div>
  </section>

  <!-- HOME (placeholder until the wealth spin is built) -->
  <section id="home" class="card hidden">
    <h2>Welcome</h2>
    <div class="stat"><span>Player ID</span><b id="h_pid">-</b></div>
    <div class="stat"><span>Email</span><b id="h_email">-</b></div>
    <div class="stat"><span>Wealth status</span><b id="h_wealth">Not spun yet</b></div>
    <div class="stat"><span>Balance</span><b id="h_bal">₦0</b></div>
    <div class="stat"><span>Character</span><b id="h_char">Not chosen</b></div>
    <p class="note">All amounts are virtual game currency, not real money.</p>
    <button class="alt" id="btnLogout">Log out</button>
    <div id="m_home" class="msg"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
/* ====== PASTE YOUR OWN VALUES HERE ====== */
const SUPABASE_URL = "https://fjdlpgfezqmvhavamffs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LyzzW9CwbtT-FDJFkbJh-w_RTYFTKWM";
/* ========================================= */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const screens = ["login","register","forgot","newpass","home"];
let recoveryMode = false;

function show(name){
  $("loading").classList.add("hidden");
  screens.forEach(s => $(s).classList.toggle("hidden", s !== name));
  document.querySelectorAll(".msg").forEach(m => { m.className = "msg"; m.textContent = ""; });
}
function say(id, text, ok){
  const el = $(id); el.textContent = text; el.className = "msg " + (ok ? "ok" : "err");
}
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function busy(btn, on, label){ btn.disabled = on; if(label) btn.textContent = label; }

document.querySelectorAll("[data-go]").forEach(b =>
  b.addEventListener("click", () => show(b.dataset.go)));

/* ---- Register ---- */
$("btnRegister").addEventListener("click", async () => {
  const email = $("r_email").value.trim().toLowerCase();
  const p1 = $("r_pass").value, p2 = $("r_pass2").value;
  if(!validEmail(email)) return say("m_register","Enter a valid email address.");
  if(p1.length < 8) return say("m_register","Password must be at least 8 characters.");
  if(p1 !== p2) return say("m_register","Passwords do not match.");
  const btn = $("btnRegister"); busy(btn,true,"Creating...");
  const { data, error } = await sb.auth.signUp({
    email, password: p1,
    options: { emailRedirectTo: location.origin + location.pathname }
  });
  busy(btn,false,"Create account");
  if(error) return say("m_register", error.message);
  // Supabase returns a user with no identities if the email already exists
  if(data.user && data.user.identities && data.user.identities.length === 0)
    return say("m_register","This email already has an account. Log in instead.");
  if(!data.session)
    return say("m_register","Account created. Check your email and tap the confirmation link, then log in.", true);
  await enterGame();
});

/* ---- Login ---- */
$("btnLogin").addEventListener("click", async () => {
  const email = $("l_email").value.trim().toLowerCase();
  const pass = $("l_pass").value;
  if(!validEmail(email) || !pass) return say("m_login","Enter your email and password.");
  const btn = $("btnLogin"); busy(btn,true,"Logging in...");
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  busy(btn,false,"Log in");
  if(error) return say("m_login", error.message);
  await enterGame();
});

/* ---- Forgot password ---- */
$("btnForgot").addEventListener("click", async () => {
  const email = $("f_email").value.trim().toLowerCase();
  if(!validEmail(email)) return say("m_forgot","Enter a valid email address.");
  const btn = $("btnForgot"); busy(btn,true,"Sending...");
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname
  });
  busy(btn,false,"Send reset link");
  if(error) return say("m_forgot", error.message);
  say("m_forgot","If that email has an account, a reset link is on its way.", true);
});

/* ---- Set new password ---- */
$("btnNewPass").addEventListener("click", async () => {
  const p1 = $("n_pass").value, p2 = $("n_pass2").value;
  if(p1.length < 8) return say("m_newpass","Password must be at least 8 characters.");
  if(p1 !== p2) return say("m_newpass","Passwords do not match.");
  const btn = $("btnNewPass"); busy(btn,true,"Saving...");
  const { error } = await sb.auth.updateUser({ password: p1 });
  busy(btn,false,"Save new password");
  if(error) return say("m_newpass", error.message);
  recoveryMode = false;
  await enterGame();
});

/* ---- Logout ---- */
$("btnLogout").addEventListener("click", async () => {
  await sb.auth.signOut();
  show("login");
});

/* ---- Load the player's saved progress ---- */
async function enterGame(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return show("login");
  const { data: p, error } = await sb.from("players").select("*").eq("id", user.id).maybeSingle();
  show("home");
  if(error || !p){
    return say("m_home","Could not load your player profile. Check that the SQL setup was run.");
  }
  if(p.suspended){
    await sb.auth.signOut();
    show("login");
    return say("m_login","This account is suspended.");
  }
  $("h_pid").textContent = p.player_id;
  $("h_email").textContent = user.email;
  $("h_wealth").textContent = p.wealth_status || "Not spun yet";
  $("h_bal").textContent = "₦" + Number(p.balance).toLocaleString("en-NG");
  $("h_char").textContent = p.character || "Not chosen";
}

/* ---- Start up: resume session or show login ---- */
(async function init(){
  if(SUPABASE_URL.startsWith("PASTE")){
    $("loading").textContent = "Open index.html and paste your Supabase URL and anon key first.";
    return;
  }
  sb.auth.onAuthStateChange((event) => {
    if(event === "PASSWORD_RECOVERY"){ recoveryMode = true; show("newpass"); }
  });
  const { data: { session } } = await sb.auth.getSession();
  if(recoveryMode) return;
  if(session) await enterGame(); else show("login");
})();
</script>
</body>
</html>
